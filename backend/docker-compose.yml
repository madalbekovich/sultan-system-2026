services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sultan
      POSTGRES_PASSWORD: sultan
      POSTGRES_DB: sultan_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
