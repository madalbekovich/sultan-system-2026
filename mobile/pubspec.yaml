name: sultan_system
description: Sultan System factory app — worker (production/weighing) and manager (dashboard/catalog) modes.
publish_to: "none"
version: 1.0.0+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  printing: ^5.12.0
  excel: ^4.0.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  connectivity_plus: ^6.1.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  android: false
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
    - assets/images/hero_meat.jpg
  fonts:
    # Both are variable fonts — one file, multiple weight entries so Skia
    # resolves the real wght axis instance instead of synthesizing bold.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 500
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 700
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
